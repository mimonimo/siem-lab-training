<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bridgeworks Security · 위협 탐지 실습</title>
<style>
  :root{
    /* Wazuh / EUI-inspired flat palette */
    --bg:#f5f7fa; --bg2:#eef1f6;
    --panel:#ffffff; --panel2:#f7f9fb; --panel3:#eef1f6;
    --bd:#d3dae6; --bd2:#c3ccdb;
    --ink:#1a1c21; --ink2:#4a525e; --ink3:#7a828e;
    --pri:#1a6dc2; --pri-d:#14568f; --pri-wash:#e9f2fb; --pri-bd:#bcd7f0;
    --teal:#00857a; --emer:#1a8a52; --emer-wash:#e8f5ee; --emer-bd:#b6ddc7;
    --rose:#bd2f3a; --rose-wash:#fbecee;
    --amber:#9a6a00; --amber-wash:#fbf3e0; --amber-bd:#e7d6a8;
    --navy:#16283f;
    --r:8px; --r-md:7px; --r-sm:6px;
    --sh-sm:0 1px 2px rgba(30,40,60,.06);
    --sh-md:0 2px 6px -2px rgba(30,40,60,.1);
    --sh-lg:0 8px 24px -10px rgba(30,40,60,.2),0 6px 12px -6px rgba(30,40,60,.08);
    --ring:0 0 0 3px var(--pri-wash);
    --mono:"D2Coding","JetBrains Mono","Consolas",ui-monospace,monospace;
    --sans:"Inter","Pretendard",-apple-system,"Segoe UI",Roboto,"Malgun Gothic","맑은 고딕","Apple SD Gothic Neo",sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{font-family:var(--sans);color:var(--ink);line-height:1.55;-webkit-font-smoothing:antialiased;background:var(--bg)}
  a{color:var(--pri);text-decoration:none}
  button{font-family:inherit}
  ::selection{background:#d7e0ff}
  .num{font-variant-numeric:tabular-nums}

  /* ---------- header ---------- */
  .hdr{position:sticky;top:0;z-index:30;background:#fff;
    border-bottom:1px solid var(--bd);box-shadow:none}
  .hdr-in{max-width:1000px;margin:0 auto;padding:0 20px;height:58px;display:flex;align-items:center;justify-content:space-between}
  .brand{display:flex;align-items:center;gap:11px;font-weight:750;font-size:15.5px;letter-spacing:-.3px}
  .brand .mk{width:30px;height:30px;border-radius:9px;background:var(--pri);
    display:flex;align-items:center;justify-content:center;color:#fff;font-size:15px;
    box-shadow:0 4px 12px -2px rgba(30,40,60,.12),none}
  .brand small{color:var(--ink3);font-weight:500;letter-spacing:0}
  .hdr-r{display:flex;align-items:center;gap:8px}
  .chip{display:flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--bd);border-radius:22px;
    padding:4px 12px 4px 5px;font-size:12.5px;font-weight:650;color:var(--ink2);box-shadow:var(--sh-sm)}
  .chip .av{width:24px;height:24px;border-radius:50%;background:var(--pri);color:#fff;
    display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:750}
  .hbtn{border:1px solid var(--bd);background:var(--panel);color:var(--ink2);border-radius:9px;padding:7px 13px;
    font-size:12.5px;font-weight:650;cursor:pointer;transition:.16s ease;box-shadow:var(--sh-sm)}
  .hbtn:hover{background:var(--panel2);border-color:var(--bd2);transform:translateY(-1px)}
  .hbtn:active{transform:translateY(0)}
  .hbtn.pri{background:var(--pri);color:#fff;border-color:transparent;
    box-shadow:0 4px 12px -3px rgba(30,40,60,.14),none}
  .hbtn.pri:hover{background:var(--pri-d)}

  .wrap{max-width:1000px;margin:24px auto;padding:0 20px}

  /* ---------- login ---------- */
  .login-wrap{min-height:calc(100vh - 58px);display:flex;align-items:center;justify-content:center;padding:20px}
  .login{width:100%;max-width:392px;background:var(--panel);border:1px solid var(--bd);border-radius:20px;
    box-shadow:var(--sh-lg);padding:34px 30px;position:relative;overflow:hidden}
  .login::before{content:"";position:absolute;inset:0 0 auto 0;height:4px;background:var(--pri)}
  .login .ic{width:54px;height:54px;border-radius:15px;margin:6px auto 14px;background:var(--pri);
    display:flex;align-items:center;justify-content:center;font-size:25px;box-shadow:0 8px 22px -6px rgba(30,40,60,.14)}
  .login h1{font-size:21px;text-align:center;margin:0 0 4px;letter-spacing:-.4px;font-weight:750}
  .login .sub{color:var(--ink3);font-size:13px;text-align:center;margin:0 0 22px}
  .fld{margin-bottom:12px}
  .fld label{display:block;font-size:11.5px;font-weight:700;color:var(--ink2);margin-bottom:6px;letter-spacing:.2px}
  .fld input{width:100%;padding:12px 13px;border:1.5px solid var(--bd2);border-radius:10px;font-size:15px;
    background:var(--panel2);outline:none;transition:.16s;color:var(--ink)}
  .fld input:focus{border-color:var(--pri);background:#fff;box-shadow:var(--ring)}
  #loginErr{color:var(--rose);font-size:12.5px;min-height:17px;font-weight:650;margin:1px 0 6px}
  .login .go{width:100%;padding:12px;background:var(--pri);color:#fff;border:0;border-radius:10px;
    font-size:15px;font-weight:750;cursor:pointer;transition:.16s;box-shadow:0 8px 18px -6px rgba(30,40,60,.14)}
  .login .go:hover{transform:translateY(-1px)} .login .go:active{transform:translateY(0)}
  .login .tip{margin-top:15px;font-size:12px;color:var(--ink3);text-align:center;background:var(--panel2);
    border:1px dashed var(--bd2);border-radius:10px;padding:10px}
  .login .tip code{font-family:var(--mono);background:#fff;border:1px solid var(--bd);border-radius:5px;padding:1px 6px;color:var(--pri)}

  /* ---------- context bar ---------- */
  .ctx{background:var(--panel);border:1px solid var(--bd);border-radius:var(--r-md);
    padding:11px 16px;margin-bottom:16px;display:flex;align-items:center;gap:10px;font-size:12.5px;color:var(--ink2);
    flex-wrap:wrap;box-shadow:var(--sh-sm)}
  .ctx .dot{width:8px;height:8px;border-radius:50%;background:var(--teal);box-shadow:0 0 0 4px rgba(14,165,164,.16)}
  .ctx b{color:var(--ink)}
  .ctx .sp{flex:1}
  .ctx code{font-family:var(--mono);background:var(--panel3);border:1px solid var(--bd2);border-radius:5px;padding:1px 7px;color:var(--pri);font-weight:650;letter-spacing:-.2px}
  .wzcred{display:flex;align-items:center;gap:7px;background:var(--pri-wash);border:1px solid var(--pri-bd);border-radius:22px;padding:4px 6px 4px 12px;color:var(--ink2);font-weight:650}
  .copybtn{border:0;background:var(--pri);color:#fff;border-radius:14px;padding:4px 11px;font-size:11px;font-weight:750;cursor:pointer;transition:.14s}
  .copybtn:hover{filter:brightness(1.05)}

  /* ---------- summary tiles ---------- */
  .tiles{display:grid;grid-template-columns:repeat(3,1fr) 1.5fr;gap:13px;margin-bottom:18px}
  .tile{background:var(--panel);border:1px solid var(--bd);border-radius:var(--r);box-shadow:var(--sh-sm);
    padding:15px 17px;position:relative;overflow:hidden;transition:.18s}
  .tile:hover{box-shadow:var(--sh-md);transform:translateY(-1px)}
  .tile::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--bd2)}
  .tile.sc::before{background:var(--pri)} .tile.sv::before{background:var(--emer)}
  .tile .n{font-size:28px;font-weight:800;letter-spacing:-1px;line-height:1;font-variant-numeric:tabular-nums}
  .tile .l{font-size:11.5px;color:var(--ink3);font-weight:650;margin-top:3px;letter-spacing:.1px}
  .tile.sc .n{color:var(--pri)} .tile.sv .n{color:var(--emer)}
  .tile.prog{display:flex;flex-direction:column;justify-content:center}
  .tile.prog .top{display:flex;justify-content:space-between;font-size:12px;color:var(--ink2);font-weight:700;margin-bottom:9px}
  .tile.prog .top .num{color:var(--pri)}
  .bar{height:9px;background:var(--panel3);border-radius:6px;overflow:hidden;box-shadow:inset 0 1px 2px rgba(15,23,42,.06)}
  .bar>i{display:block;height:100%;border-radius:6px;background:var(--pri);width:0;
    transition:width .6s cubic-bezier(.2,.8,.2,1);box-shadow:0 0 8px -1px rgba(30,40,60,.12)}

  /* ---------- stages strip ---------- */
  .stages{display:flex;gap:12px;margin-bottom:20px;flex-wrap:wrap}
  .stg{flex:1;min-width:158px;background:var(--panel);border:1px solid var(--bd);border-radius:var(--r-md);
    box-shadow:var(--sh-sm);padding:12px 14px;transition:.18s}
  .stg.unlocked:hover{box-shadow:var(--sh-md)}
  .stg.locked{background:repeating-linear-gradient(135deg,#f5f7fb,#f5f7fb 8px,#f1f4f9 8px,#f1f4f9 16px);opacity:.85}
  .stg .sh{display:flex;justify-content:space-between;align-items:center;font-size:13px;font-weight:750}
  .stg .sh .st{font-size:10px;font-weight:750;padding:2px 8px;border-radius:20px;letter-spacing:.2px}
  .stg.unlocked .sh .st{background:var(--emer-wash);color:var(--emer)}
  .stg.locked .sh .st{background:var(--panel3);color:var(--ink3)}
  .stg .cnt{font-size:11.5px;color:var(--ink3);margin-top:3px;font-weight:600}
  .stg .sbar{height:6px;background:var(--panel3);border-radius:4px;overflow:hidden;margin-top:8px}
  .stg .sbar>i{display:block;height:100%;background:var(--pri);width:0;transition:width .5s}

  /* ---------- section ---------- */
  .secttl{display:flex;align-items:center;gap:11px;margin:26px 2px 13px;font-size:14.5px;font-weight:750;letter-spacing:-.2px}
  .secttl .pill{font-size:11px;font-weight:750;color:#fff;background:var(--pri);border-radius:6px;padding:3px 10px;box-shadow:0 3px 8px -3px rgba(30,40,60,.14)}
  .secttl .pill.b{background:var(--amber);box-shadow:0 3px 8px -3px rgba(30,40,60,.12)}
  .secttl .ln{flex:1;height:1px;background:linear-gradient(90deg,var(--bd),transparent)}
  .secttl .cnt{font-size:12px;color:var(--ink3);font-weight:600}

  /* ---------- question card ---------- */
  .q{background:var(--panel);border:1px solid var(--bd);border-radius:var(--r);box-shadow:var(--sh-sm);
    margin-bottom:14px;position:relative;transition:box-shadow .2s,transform .2s;overflow:hidden}
  .q:hover{box-shadow:var(--sh-md)}
  .q::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:transparent;transition:.2s}
  .q.solved::before{background:var(--emer)}
  .q.solved{background:var(--emer-wash)}
  .q.manualdone::before{background:var(--amber)} .q.manualdone{background:var(--amber-wash)}
  .q-in{display:flex;gap:14px;padding:17px 19px}
  .qno{flex:none;width:34px;height:34px;border-radius:10px;background:var(--panel3);color:var(--ink2);
    border:1px solid var(--bd);display:flex;align-items:center;justify-content:center;font-weight:750;font-size:15px;font-variant-numeric:tabular-nums}
  .q.solved .qno{background:var(--emer);color:#fff;border-color:transparent;box-shadow:0 4px 10px -3px rgba(30,40,60,.12)}
  .q.manualdone .qno{background:var(--amber);color:#fff;border-color:transparent}
  .qb{flex:1;min-width:0}
  .badges{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:9px}
  .badges span{font-size:11px;font-weight:650;border-radius:20px;padding:2px 9px;color:var(--ink2);background:var(--panel3);border:1px solid var(--bd)}
  .badges .sc{color:var(--pri);background:var(--pri-wash);border-color:var(--pri-bd)}
  .badges .man{color:var(--amber);background:var(--amber-wash);border-color:var(--amber-bd)}
  .badges .disc{color:#7c3aed;background:#f3eeff;border-color:#ddd0f7}
  .qtext{font-size:15.5px;font-weight:700;line-height:1.55;letter-spacing:-.2px;color:var(--ink)}
  .primer{margin-top:9px;font-size:12.5px;color:var(--ink2);background:var(--pri-wash);
    border:1px solid var(--pri-bd);border-radius:10px;padding:9px 12px;line-height:1.65}
  .primer b{color:var(--pri-d)} .primer a{font-weight:700;white-space:nowrap;margin-left:4px}
  .hints{margin-top:11px;display:flex;flex-direction:column;gap:6px}
  .hintline{display:flex;gap:9px;background:var(--amber-wash);border:1px solid var(--amber-bd);border-radius:10px;
    padding:9px 12px;font-size:12.5px;color:#6b4e12;line-height:1.55;animation:pop .24s ease}
  @keyframes pop{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
  .fmt{font-size:11.5px;color:var(--ink3);margin:11px 0 5px;font-weight:650;display:flex;align-items:center;gap:5px}
  .fmt b{color:var(--pri);font-family:var(--mono);font-weight:700}
  .ansrow{display:flex;gap:9px}
  .ansrow input,.ansrow textarea{flex:1;padding:11px 13px;border:1.5px solid var(--bd2);border-radius:10px;font-size:14px;
    background:var(--panel2);font-family:var(--mono);outline:none;transition:.16s;resize:vertical;color:var(--ink)}
  .ansrow textarea{min-height:70px;line-height:1.55}
  .ansrow input:focus,.ansrow textarea:focus{border-color:var(--pri);background:#fff;box-shadow:var(--ring)}
  .ansrow input:disabled,.ansrow textarea:disabled{opacity:.75;background:var(--panel3)}
  .submit{align-self:flex-start;padding:11px 20px;background:var(--pri);color:#fff;border:0;
    border-radius:10px;font-weight:750;font-size:14px;cursor:pointer;transition:.16s;white-space:nowrap;
    box-shadow:0 6px 14px -5px rgba(30,40,60,.14),none}
  .submit:hover:not(:disabled){transform:translateY(-1px)} .submit:active:not(:disabled){transform:translateY(0)}
  .submit:disabled{opacity:.45;cursor:default;box-shadow:none;background:var(--ink3)}
  .toolrow{margin-top:11px}
  .hintbtn{display:inline-flex;align-items:center;gap:6px;background:var(--panel);color:var(--amber);border:1px solid var(--amber-bd);
    border-radius:9px;padding:7px 13px;font-size:12.5px;font-weight:700;cursor:pointer;transition:.16s;box-shadow:var(--sh-sm)}
  .hintbtn:hover{background:var(--amber-wash);transform:translateY(-1px)}
  .fb{font-size:13px;font-weight:750;margin-top:12px;display:flex;align-items:center;gap:6px}
  .fb.ok{color:var(--emer)} .fb.no{color:var(--rose)} .fb.man{color:var(--amber)}
  .explain{margin-top:13px;background:var(--emer-wash);border:1px solid var(--emer-bd);
    border-radius:12px;padding:13px 15px;font-size:13px;line-height:1.75;box-shadow:inset 0 1px 0 rgba(255,255,255,.6)}
  .explain .et{font-weight:750;color:var(--emer);margin-bottom:6px;display:flex;align-items:center;gap:6px}
  .explain code{font-family:var(--mono);background:#fff;border:1px solid var(--emer-bd);border-radius:5px;padding:1px 6px;word-break:break-all;color:#0b6a41}
  .explain .kk{color:var(--ink2);font-weight:750;margin-right:2px}
  .explain .insight{margin-top:10px;padding-top:10px;border-top:1px dashed var(--emer-bd);color:#265343}
  .explain .insight .it{font-weight:750;color:var(--teal)}
  .lockmsg{font-size:14px;color:var(--ink3);font-weight:650;padding:9px 0}
  .q.locked{opacity:.9} .q.locked .qno{background:var(--panel3);color:var(--ink3);border-color:var(--bd)}

  /* ---------- leaderboard drawer ---------- */
  .drawer{position:fixed;inset:0;background:rgba(15,23,42,.4);backdrop-filter:blur(3px);z-index:40;display:none;justify-content:flex-end}
  .drawer.on{display:flex}
  .drawer .panel{width:330px;max-width:88vw;height:100%;background:var(--panel);box-shadow:-14px 0 40px -12px rgba(15,23,42,.35);
    padding:20px 22px;overflow:auto;animation:slide .24s cubic-bezier(.2,.8,.2,1)}
  @keyframes slide{from{transform:translateX(100%)}to{transform:none}}
  .drawer h3{margin:0 0 14px;font-size:16px;display:flex;justify-content:space-between;align-items:center;font-weight:750}
  .drawer .x{cursor:pointer;color:var(--ink3);font-size:22px;line-height:1}
  .lbrow{display:flex;align-items:center;gap:11px;padding:9px 0;border-bottom:1px solid var(--bd)}
  .lbrow .rk{width:24px;height:24px;border-radius:7px;background:var(--panel3);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:750;color:var(--ink2)}
  .lbrow:nth-child(1) .rk{background:linear-gradient(140deg,#ffd75e,#f5a623);color:#7a5600}
  .lbrow:nth-child(2) .rk{background:#e2e8f0}.lbrow:nth-child(3) .rk{background:#f0dcc8;color:#8a5a30}
  .lbrow .nm{flex:1;font-weight:700;font-size:14px} .lbrow .pt{font-size:13px;color:var(--ink2);font-variant-numeric:tabular-nums}

  /* ---------- question navigator ---------- */
  .qnav{position:sticky;top:66px;z-index:20;background:rgba(255,255,255,.92);backdrop-filter:saturate(180%) blur(8px);
    border:1px solid var(--bd);border-radius:var(--r-md);box-shadow:var(--sh-sm);padding:10px 13px;margin-bottom:16px}
  .qnav .nt{font-size:11px;font-weight:700;color:var(--ink3);margin-bottom:8px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .qnav .nt .lg{display:inline-flex;align-items:center;gap:4px}
  .qnav .sw{width:11px;height:11px;border-radius:3px;display:inline-block;border:1px solid var(--bd)}
  .qnav .grid{display:flex;flex-wrap:wrap;gap:6px}
  .qchip{width:31px;height:31px;border-radius:8px;border:1px solid var(--bd);background:var(--panel);color:var(--ink2);
    font-size:12.5px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:.14s;font-variant-numeric:tabular-nums}
  .qchip:hover{transform:translateY(-1px);border-color:var(--pri);color:var(--pri)}
  .qchip.solved{background:var(--emer);color:#fff;border-color:transparent}
  .qchip.done{background:var(--amber);color:#fff;border-color:transparent}
  .qchip.locked{background:var(--panel3);color:var(--ink3);cursor:not-allowed;opacity:.7}
  .qchip.bon{border-style:dashed}
  .q{scroll-margin-top:124px}
  .q.flash{animation:flash 1.1s ease}
  @keyframes flash{0%,40%{box-shadow:0 0 0 3px var(--pri-wash),var(--sh-md)}100%{box-shadow:var(--sh-sm)}}

  /* ---------- Q&A board ---------- */
  .qpanel{width:420px;max-width:92vw;height:100%;display:flex;flex-direction:column;background:var(--panel);box-shadow:-14px 0 40px -12px rgba(15,23,42,.35);animation:slide .24s cubic-bezier(.2,.8,.2,1)}
  .qhd{flex:none;padding:15px 18px;border-bottom:1px solid var(--bd);display:flex;justify-content:space-between;align-items:flex-start}
  .qhd b{font-size:15px}.qhd small{display:block;font-size:11.5px;color:var(--ink3);margin-top:2px;font-weight:400}
  .qhd .x{cursor:pointer;color:var(--ink3);font-size:24px;line-height:1}
  .qna-list{flex:1;overflow:auto;padding:16px;display:flex;flex-direction:column;gap:12px;background:var(--bg)}
  .qthread{background:var(--panel);border:1px solid var(--bd);border-radius:12px;padding:12px 13px;box-shadow:var(--sh-sm)}
  .qtop{display:flex;align-items:center;gap:7px;margin-bottom:7px;flex-wrap:wrap}
  .qav{width:26px;height:26px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;font-size:10.5px;font-weight:750;color:#fff;background:var(--ink3)}
  .qav.instr{background:var(--emer)}.qav.me{background:var(--pri)}
  .qwho{font-weight:700;font-size:13px}
  .qrole{font-size:9.5px;font-weight:750;padding:1px 6px;border-radius:20px;background:var(--panel3);color:var(--ink2)}
  .qrole.instr{background:var(--emer-wash);color:var(--emer)}
  .qtag{font-size:10px;font-weight:700;color:var(--pri);background:var(--pri-wash);border:1px solid var(--pri-bd);border-radius:5px;padding:0 6px}
  .qtime{font-size:11px;color:var(--ink3)}
  .qstatus{margin-left:auto;font-size:10px;font-weight:750;padding:2px 9px;border-radius:20px}
  .qstatus.wait{background:var(--amber-wash);color:var(--amber)}.qstatus.done{background:var(--emer-wash);color:var(--emer)}
  .qbody{font-size:13.5px;line-height:1.62;color:var(--ink);white-space:pre-wrap;word-break:break-word}
  .qreplies{margin:10px 0 0;display:flex;flex-direction:column;gap:8px;border-left:2px solid var(--bd);padding-left:11px}
  .qrep{background:var(--panel2);border-radius:9px;padding:8px 10px}
  .qrep.instr{background:var(--emer-wash);border:1px solid var(--emer-bd)}
  .qact{margin-top:9px}
  .qact button{border:1px solid var(--bd);background:var(--panel2);color:var(--pri);border-radius:7px;padding:4px 12px;font-size:11.5px;font-weight:700;cursor:pointer}
  .qact button:hover{background:var(--pri-wash);border-color:var(--pri-bd)}
  .qempty{text-align:center;color:var(--ink3);font-size:13px;padding:44px 16px;line-height:1.8}
  .qcompose{flex:none;border-top:1px solid var(--bd);padding:11px 14px;background:var(--panel)}
  .qcbar{display:flex;align-items:center;gap:8px;margin-bottom:8px;min-height:16px}
  .qcqno{display:inline-flex;align-items:center;gap:2px;font-size:11.5px;color:var(--ink2);font-weight:650;background:var(--panel3);border:1px solid var(--bd);border-radius:7px;padding:2px 6px}
  .qcqno input{width:30px;border:0;background:transparent;outline:none;font-size:12px;font-weight:700;text-align:center;color:var(--ink)}
  .qreplylbl{font-size:12px;color:var(--pri-d);font-weight:700}
  .qcancel{color:var(--rose);cursor:pointer;margin-left:6px;font-weight:600;font-size:11px}
  .qcin{display:flex;gap:8px;align-items:flex-end}
  .qcin textarea{flex:1;padding:10px 12px;border:1.5px solid var(--bd2);border-radius:12px;font-size:13px;font-family:inherit;background:var(--panel2);outline:none;resize:none;min-height:42px;max-height:120px;line-height:1.5;color:var(--ink)}
  .qcin textarea:focus{border-color:var(--pri);background:#fff;box-shadow:var(--ring)}
  .qsend{flex:none;height:42px;padding:0 16px;border-radius:10px;background:var(--pri);color:#fff;border:0;font-size:13.5px;font-weight:700;cursor:pointer}
  .qsend:hover{background:var(--pri-d)}
  .hidden{display:none!important}
  @media(max-width:720px){.tiles{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
  <header class="hdr"><div class="hdr-in">
    <div class="brand"><span class="mk">B</span><span>Bridgeworks Security <small>· 위협 탐지 실습</small></span></div>
    <div class="hdr-r" id="hdrR"></div>
  </div></header>

  <div id="loginView" class="login-wrap">
    <div class="login">
      <div class="ic">B</div>
      <h1>위협 탐지 미션</h1>
      <p class="sub">배정받은 계정으로 로그인하면 실습이 시작됩니다.</p>
      <div class="fld"><label>아이디</label><input id="userInput" placeholder="user_1" autocomplete="username"></div>
      <div class="fld"><label>비밀번호</label><input id="passInput" type="password" placeholder="••••••" autocomplete="current-password"></div>
      <div id="loginErr"></div>
      <button class="go" id="startBtn">로그인</button>
      <div class="tip">계정 예시 — 아이디 <code>user_1</code> · 비밀번호 <code>user_1</code></div>
    </div>
  </div>

  <div id="missionView" class="wrap hidden">
    <div class="ctx" id="ctxBar"></div>
    <div class="tiles">
      <div class="tile sc"><div class="n num" id="stScore">0</div><div class="l">획득 점수 · 자동채점</div></div>
      <div class="tile sv"><div class="n num" id="stSolved">0</div><div class="l">해결한 문항</div></div>
      <div class="tile"><div class="n num" id="stTotal">0</div><div class="l">전체 문항</div></div>
      <div class="tile prog"><div class="top"><span>필수 구간 진행률</span><span class="num" id="reqPct">0%</span></div><div class="bar"><i id="reqBar"></i></div></div>
    </div>
    <div id="stagesStrip" class="stages"></div>
    <div id="qnav" class="qnav"></div>
    <div id="reqWrap"></div>
    <div id="bonWrap"></div>
  </div>

  <div class="drawer" id="qnaDrawer"><div class="panel qpanel">
    <div class="qhd"><div><b>문의 게시판</b><small>강사·학생이 함께 보는 Q&amp;A</small></div><span class="x" id="qnaX">×</span></div>
    <div class="qna-list" id="qnaList"></div>
    <div class="qcompose">
      <div class="qcbar"><span class="qcqno">Q<input id="qnaQno" type="number" min="1" placeholder="?"></span>
        <span id="qnaReplyLbl" class="qreplylbl"></span></div>
      <div class="qcin"><textarea id="qnaText" placeholder="궁금한 점을 남겨 주세요"></textarea>
        <button id="qnaSend" class="qsend">등록</button></div>
    </div>
  </div></div>


<script>
const $=s=>document.querySelector(s);
let CFG={}, QS=[];
async function jget(u){const r=await fetch(u);return r.json();}
async function jpost(u,b){const r=await fetch(u,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b||{})});return r.json();}
function esc(s){return (s||'').toString().replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
/* clipboard that also works over plain HTTP (navigator.clipboard needs HTTPS/localhost) */
function copyText(t){
  if(navigator.clipboard && window.isSecureContext){ return navigator.clipboard.writeText(t).catch(()=>fallbackCopy(t)); }
  return fallbackCopy(t);
}
function fallbackCopy(t){const ta=document.createElement('textarea');ta.value=t;ta.setAttribute('readonly','');
  ta.style.position='fixed';ta.style.top='-1000px';ta.style.opacity='0';document.body.appendChild(ta);
  ta.focus();ta.select();ta.setSelectionRange(0,t.length);let ok=false;try{ok=document.execCommand('copy');}catch(e){}
  document.body.removeChild(ta);return Promise.resolve(ok);}

async function boot(){CFG=await jget('/api/config');
  if(CFG.team)enterMission(); else $('#loginView').classList.remove('hidden');}
$('#startBtn').onclick=async()=>{
  const u=$('#userInput').value.trim(),p=$('#passInput').value.trim();
  if(!u||!p){$('#loginErr').textContent='아이디와 비밀번호를 입력해 주세요';return;}
  const r=await jpost('/api/login',{username:u,password:p});
  if(r.role==='instructor'){location.href='/instructor';return;}
  if(r.team){CFG.team=r.team;enterMission();} else $('#loginErr').textContent=r.error||'로그인 실패';
};
['userInput','passInput'].forEach(id=>$('#'+id).addEventListener('keydown',e=>{if(e.key==='Enter')$('#startBtn').click();}));

function enterMission(){
  $('#loginView').classList.add('hidden'); $('#missionView').classList.remove('hidden');
  const wz=CFG.wazuh_url||('https://'+location.hostname);
  const isInstr = CFG.role==='instructor';
  const label = isInstr ? '강사 · 미리보기' : CFG.team;
  const ini = isInstr ? '강' : (CFG.team.match(/\d+/)||[CFG.team[0]])[0];
  const instrBtn = isInstr ? `<button class="hbtn" onclick="location.href='/instructor'" style="background:var(--pri-wash);border-color:var(--pri-bd);color:var(--pri-d);font-weight:750">강사 도구</button>` : '';
  $('#hdrR').innerHTML=`<div class="chip"><span class="av">${esc(ini)}</span>${esc(label)}</div>
    ${instrBtn}
    <button class="hbtn pri" onclick="window.open('${wz}','_blank')">Wazuh 대시보드 ↗</button>
    <button class="hbtn" onclick="window.open('/guide','_blank')">교안</button>
    <button class="hbtn" id="qnaBtn">문의</button>
    <button class="hbtn" id="logoutBtn">로그아웃</button>`;
  $('#logoutBtn').onclick=async()=>{await jpost('/api/logout');location.reload();};
  $('#qnaBtn').onclick=openQna; $('#qnaX').onclick=closeQna; $('#qnaSend').onclick=sendQna;
  $('#qnaDrawer').onclick=e=>{if(e.target.id==='qnaDrawer')closeQna();};
  const dt=CFG.dataset_time||''; const wu=CFG.wazuh_user||'admin', wpw=CFG.wazuh_pass||'';
  const cred = wpw ? `<span class="wzcred">Wazuh 로그인 · <b>${esc(wu)}</b> / <code>${esc(wpw)}</code>
    <button class="copybtn" id="wzCopy">복사</button></span>` : '';
  const instrNote = isInstr ? `<span style="background:var(--pri-wash);border:1px solid var(--pri-bd);color:var(--pri-d);border-radius:20px;padding:2px 11px;font-weight:700;font-size:11.5px">강사 미리보기 — 전체 해금 · 학생 점수와 분리</span> ` : '';
  $('#ctxBar').innerHTML=`<span class="dot"></span>${instrNote}<span>이 로그셋 기준 시각 <b>${esc(dt)}</b> · 이벤트는 <b>이전 24시간</b> 내 분포 (Wazuh 비면 <b>Last 1 year</b>)</span>
    <span class="sp"></span>${cred}`;
  const wc=$('#wzCopy'); if(wc) wc.onclick=async()=>{await copyText(wpw);wc.textContent='복사됨 ';setTimeout(()=>wc.textContent='복사',1200);};
  loadQuestions();
}
function badge(q){
  let b=`<span class="sc">${q.score}점</span><span>${esc(q.type)}</span><span>난이도 ${q.diff}</span><span>스토리 ${q.sl}</span>`;
  if(!q.auto) b+=`<span class="man">강사채점</span>`; if(q.discuss) b+=`<span class="disc">조별토의</span>`;
  return b;
}
function hintsHtml(st){return (st.hints||[]).map(h=>`<div class="hintline"><span></span><span>${esc(h)}</span></div>`).join('');}
function explainHtml(ex){ if(!ex)return'';
  const steps=(ex.steps&&ex.steps.length)?`<div class="insight"><span class="it">풀이 단계</span><br>${ex.steps.map((s,i)=>(i+1)+'. '+esc(s)).join('<br>')}</div>`:'';
  const ins=ex.insight?`<div class="insight"><span class="it">분석 관점</span><br>${esc(ex.insight)}</div>`:'';
  return `<div class="explain"><div class="et">해설</div>
    <span class="kk">정답</span> ${esc(ex.answer)}<br>
    <span class="kk">근거</span> ${esc(ex.evidence)}<br>
    <span class="kk">조회</span> <code>${esc(ex.wazuh)}</code>${steps}${ins}</div>`;
}
function fbHtml(st){
  if(!st||!st.status) return '';
  if(st.status==='correct') return `<div class="fb ok">정답 · +${st.score}점 획득</div>`;
  if(st.status==='graded')  return `<div class="fb man">채점 완료 · ${st.score}점</div>`;
  if(st.status==='manual')  return `<div class="fb man">⏳ 제출됨 · 강사 채점 대기</div>`;
  if(st.status==='wrong')   return `<div class="fb no">오답 (${st.wrong_count}회) · 오답당 −${CFG.wrong_penalty}점</div>`;
  return '';
}
function qCard(q){
  if(q.locked){
    return `<div class="q locked" data-qno="${q.qno}"><div class="q-in">
      <div class="qno"></div><div class="qb">
        <div class="badges"><span>${q.stage}단계</span><span class="sc">${q.score}점</span></div>
        <div class="lockmsg">이전 단계를 완료하면 열립니다</div>
      </div></div></div>`;
  }
  const st=q.state||{};
  const solved=st.status==='correct';
  const cls=solved?'q solved':((st.status==='manual'||st.status==='graded')?'q manualdone':'q');
  const hu=st.hints_used||0;
  const nextCost=(hu+1)*(CFG.hint_penalty||1);
  const hintBtn=(solved||hu>=q.max_hints)?'':`<button class="hintbtn">힌트 (다음 −${nextCost}점) · ${hu}/${q.max_hints}</button>`;
  const av=esc(st.answer||'');
  const field = q.auto
    ? `<input placeholder="${esc(q.fmt||'답안 입력')}" value="${av}" ${solved?'disabled':''}>`
    : `<textarea placeholder="${esc(q.fmt||'판단과 근거를 함께 작성해 주세요')}" ${solved?'disabled':''}>${av}</textarea>`;
  return `<div class="${cls}" data-qno="${q.qno}"><div class="q-in">
    <div class="qno">${q.qno}</div>
    <div class="qb">
      <div class="badges">${badge(q)}</div>
      <div class="qtext">${esc(q.question)}</div>
      ${q.primer?`<div class="primer"><b>이해 돕기</b> · ${esc(q.primer)}<a href="/guide" target="_blank">교안 ↗</a></div>`:''}
      <div class="hints">${hintsHtml(st)}</div>
      <div class="fmt">답안 형식 · <b>${esc(q.fmt||'')}</b></div>
      <div class="ansrow">${field}<button class="submit" ${solved?'disabled':''}>제출</button></div>
      <div class="toolrow">${hintBtn}</div>
      ${fbHtml(st)}${explainHtml(st.explain)}
    </div></div></div>`;
}
async function loadQuestions(){
  const d=await jget('/api/questions'); QS=d.questions;
  const req=QS.filter(q=>q.section==='필수'), bon=QS.filter(q=>q.section==='보너스');
  $('#reqWrap').innerHTML=`<div class="secttl"><span class="pill">필수</span>핵심 문항<span class="ln"></span><span class="cnt">${req.length}문항 · 먼저 풀어보세요</span></div>`+req.map(qCard).join('');
  $('#bonWrap').innerHTML=`<div class="secttl"><span class="pill b">보너스</span>심화 문항<span class="ln"></span><span class="cnt">${bon.length}문항</span></div>`+bon.map(qCard).join('');
  QS.forEach(q=>wireCard(q.qno)); $('#stTotal').textContent=CFG.total; renderStages(d.stages); updateSummary(d); renderNav();
  startPoll();
}
function renderNav(){
  const chip=q=>{
    let c='qchip'; const st=q.state||{};
    if(q.section==='보너스') c+=' bon';
    if(q.locked) c+=' locked';
    else if(st.status==='correct') c+=' solved';
    else if(st.status==='manual'||st.status==='graded') c+=' done';
    const t=q.locked?'잠김':(q.question||'').slice(0,42);
    return `<div class="${c}" ${q.locked?'':`onclick="jumpTo(${q.qno})"`} title="${esc(t)}">${q.qno}</div>`;
  };
  $('#qnav').innerHTML=`<div class="nt">문항 바로가기
      <span class="lg"><span class="sw" style="background:var(--emer);border-color:transparent"></span>완료</span>
      <span class="lg"><span class="sw" style="background:#eef2f8"></span>진행 가능</span>
      <span class="lg"><span class="sw" style="background:#eef2f8;opacity:.7"></span>잠김</span></div>
    <div class="grid">${QS.map(chip).join('')}</div>`;
}
window.jumpTo=(qno)=>{const el=document.querySelector(`.q[data-qno="${qno}"]`);
  if(el){el.scrollIntoView({behavior:'smooth',block:'start'});el.classList.remove('flash');void el.offsetWidth;el.classList.add('flash');}};

/* ---- near-real-time sync: reflect instructor unlock/grade without manual refresh ---- */
let pollT=null;
function startPoll(){ if(pollT)return; pollT=setInterval(pollTick, 8000); }
async function pollTick(){
  if(document.hidden) return;
  const d=await jget('/api/questions'); if(!d||!d.questions) return;
  const ae=document.activeElement;
  const activeQno=ae&&ae.closest&&ae.closest('.q')?ae.closest('.q').getAttribute('data-qno'):null;
  const prev={}; QS.forEach(q=>prev[q.qno]=q);
  QS=d.questions; renderStages(d.stages); updateSummary(d); renderNav();
  QS.forEach(q=>{
    const p=prev[q.qno]; if(!p) return;
    const ps=p.state&&p.state.status, cs=q.state&&q.state.status;
    if((p.locked!==q.locked || ps!==cs) && String(q.qno)!==String(activeQno)){
      const old=document.querySelector(`.q[data-qno="${q.qno}"]`);
      if(old){const t=document.createElement('div');t.innerHTML=qCard(q);old.replaceWith(t.firstElementChild);wireCard(q.qno);}
    }
  });
}

/* ---- Q&A board ---- */
let qnaTimer=null, qnaReplyTo=0;
function openQna(){$('#qnaDrawer').classList.add('on');loadQna();if(qnaTimer)clearInterval(qnaTimer);qnaTimer=setInterval(loadQna,7000);}
function closeQna(){$('#qnaDrawer').classList.remove('on');if(qnaTimer){clearInterval(qnaTimer);qnaTimer=null;}}
function fmtTime(t){const d=new Date(t*1000);const p=n=>('0'+n).slice(-2);return p(d.getHours())+':'+p(d.getMinutes());}
function qAvatar(p,me){const cls=p.role==='instructor'?'instr':(me?'me':'');
  const m=(p.author||'').match(/\d+/); const ini=p.role==='instructor'?'강':(m?m[0]:(p.author||'?')[0]);
  return `<span class="qav ${cls}">${esc(ini)}</span>`;}
function qHead(p,me,extra){return `<div class="qtop">${qAvatar(p,me)}<span class="qwho">${esc(p.author)}</span>`+
  `<span class="qrole ${p.role==='instructor'?'instr':''}">${p.role==='instructor'?'강사':'학생'}</span>`+
  (p.qno?`<span class="qtag">Q${p.qno}</span>`:'')+`<span class="qtime">${fmtTime(p.ts)}</span>${extra||''}</div>`;}
async function loadQna(){
  const d=await jget('/api/qna');
  if(d.error){$('#qnaList').innerHTML=`<div class="qempty">${esc(d.error)}</div>`;return;}
  const posts=d.posts||[], tops=posts.filter(p=>!p.parent), reps=posts.filter(p=>p.parent);
  const me=CFG.team;
  if(!tops.length){$('#qnaList').innerHTML='<div class="qempty">아직 등록된 문의가 없습니다.<br>궁금한 점을 남겨 보세요.</div>';return;}
  const nearBottom = (()=>{const el=$('#qnaList');return el&&(el.scrollHeight-el.scrollTop-el.clientHeight<60);})();
  $('#qnaList').innerHTML=tops.map(p=>{
    const rs=reps.filter(r=>r.parent===p.id);
    const answered=rs.some(r=>r.role==='instructor');
    const st=answered?'<span class="qstatus done">답변완료</span>':'<span class="qstatus wait">답변대기</span>';
    const replies=rs.length?`<div class="qreplies">${rs.map(r=>`<div class="qrep ${r.role==='instructor'?'instr':''}">${qHead(r,r.author===me)}<div class="qbody">${esc(r.body)}</div></div>`).join('')}</div>`:'';
    return `<div class="qthread">${qHead(p,p.author===me,st)}<div class="qbody">${esc(p.body)}</div>${replies}
      <div class="qact"><button onclick="qnaReply(${p.id},'${esc(p.author)}')">답글 달기</button></div></div>`;
  }).join('');
  if(nearBottom){const el=$('#qnaList');el.scrollTop=el.scrollHeight;}
}
window.qnaReply=(id,who)=>{qnaReplyTo=id;const t=$('#qnaText');
  $('#qnaReplyLbl').innerHTML=`${esc(who||'')} 님에게 답글 <span class="qcancel" onclick="qnaCancelReply()">취소</span>`;
  t.focus();};
window.qnaCancelReply=()=>{qnaReplyTo=0;$('#qnaReplyLbl').innerHTML='';};
async function sendQna(){const t=$('#qnaText');const v=(t.value||'').trim();if(!v)return;
  const qno=parseInt($('#qnaQno').value,10)||0;
  const r=await jpost('/api/qna',{body:v,parent:qnaReplyTo,qno:qno});if(r&&r.error){alert(r.error);return;}
  t.value='';$('#qnaQno').value='';qnaReplyTo=0;$('#qnaReplyLbl').innerHTML='';loadQna();}
function renderStages(stages){
  if(!stages){$('#stagesStrip').innerHTML='';return;}
  $('#stagesStrip').innerHTML=stages.map(s=>{
    const pct=s.total?Math.round(s.done/s.total*100):0;
    return `<div class="stg ${s.unlocked?'unlocked':'locked'}">
      <div class="sh"><span>${esc(s.name)}</span><span class="st">${s.unlocked?'열림':'잠김'}</span></div>
      <div class="cnt">${s.done}/${s.total} 완료</div>
      <div class="sbar"><i style="width:${pct}%"></i></div></div>`;
  }).join('');
}
function updateSummary(d){
  const req=QS.filter(q=>q.section==='필수');
  const reqDone=req.filter(q=>q.state&&['correct','graded','manual'].includes(q.state.status)).length;
  const solved=QS.filter(q=>q.state&&q.state.status==='correct').length;
  $('#stScore').textContent=d.score; $('#stSolved').textContent=solved;
  const pct=req.length?Math.round(reqDone/req.length*100):0;
  $('#reqPct').textContent=pct+'%'; $('#reqBar').style.width=pct+'%';
}
async function refreshCard(qno){
  const d=await jget('/api/questions'); QS=d.questions; renderStages(d.stages); updateSummary(d); renderNav();
  const q=QS.find(x=>x.qno===qno); if(!q)return;
  const old=document.querySelector(`.q[data-qno="${qno}"]`);
  if(old){const t=document.createElement('div');t.innerHTML=qCard(q);old.replaceWith(t.firstElementChild);wireCard(qno);}
}
function wireCard(qno){
  const card=document.querySelector(`.q[data-qno="${qno}"]`); if(!card)return;
  const sb=card.querySelector('.submit'), hb=card.querySelector('.hintbtn');
  const fld=card.querySelector('input,textarea');
  if(sb) sb.onclick=async()=>{const a=(fld.value||'').trim(); if(!a)return; sb.disabled=true; const r=await jpost('/api/submit',{qno,answer:a}); if(r&&r.error){sb.disabled=false;return;} await refreshCard(qno);};
  if(hb) hb.onclick=async()=>{hb.disabled=true;await jpost('/api/hint',{qno});await refreshCard(qno);};
  if(fld&&fld.tagName==='INPUT'&&sb) fld.addEventListener('keydown',e=>{if(e.key==='Enter')sb.click();});
}
boot();
</script>
</body>
</html>
