<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>강사 콘솔 · SIEM 미션</title>
<style>
  /* Wazuh / EUI-inspired flat palette */
  :root{--bg:#f5f7fa;--panel:#fff;--panel2:#f7f9fb;--panel3:#eef1f6;--bd:#d3dae6;--bd2:#c3ccdb;
    --ink:#1a1c21;--ink2:#4a525e;--ink3:#7a828e;--pri:#1a6dc2;--pri-d:#14568f;--pri-wash:#e9f2fb;--pri-bd:#bcd7f0;
    --teal:#00857a;--emer:#1a8a52;--emer-wash:#e8f5ee;--emer-bd:#b6ddc7;--rose:#bd2f3a;--amber:#9a6a00;--amber-wash:#fbf3e0;--amber-bd:#e7d6a8;
    --navy:#16283f;
    --r:8px;--r-md:7px;--sh-sm:0 1px 2px rgba(30,40,60,.06);
    --sh-md:0 2px 6px -2px rgba(30,40,60,.1);
    --sh-lg:0 8px 24px -10px rgba(30,40,60,.2);--ring:0 0 0 3px var(--pri-wash);
    --mono:"D2Coding","Consolas",ui-monospace,monospace;
    --sans:"Inter","Pretendard",-apple-system,"Segoe UI",Roboto,"Malgun Gothic","맑은 고딕",sans-serif;}
  *{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);line-height:1.55;-webkit-font-smoothing:antialiased}
  .top{position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid var(--bd)}
  .top-in{max-width:1040px;margin:0 auto;padding:0 20px;height:54px;display:flex;align-items:center;justify-content:space-between}
  .brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:15px}
  .brand .mk{width:28px;height:28px;border-radius:6px;background:var(--navy);display:flex;align-items:center;justify-content:center;color:#fff}
  .brand small{color:var(--ink3);font-weight:500}
  .btn{border:1px solid var(--bd);background:var(--panel);color:var(--ink2);border-radius:6px;padding:7px 13px;font-size:13px;font-weight:600;cursor:pointer;transition:.12s}
  .btn:hover{background:var(--panel2);border-color:var(--bd2)}
  .btn.pri{background:var(--pri);color:#fff;border-color:var(--pri)}
  .btn.pri:hover{background:var(--pri-d)}
  .btn.sm{padding:5px 11px;font-size:12px}
  .btn.ghost{background:var(--panel2)}
  .wrap{max-width:1040px;margin:20px auto;padding:0 20px}
  /* gate */
  .gate{max-width:392px;margin:12vh auto;background:var(--panel);border:1px solid var(--bd);border-top:3px solid var(--pri);border-radius:var(--r);box-shadow:var(--sh-lg);padding:30px 28px;text-align:center}
  .gate .gi{width:48px;height:48px;border-radius:10px;margin:4px auto 12px;background:var(--pri);display:flex;align-items:center;justify-content:center;font-size:22px;color:#fff}
  .gate h1{font-size:18px;margin:0 0 5px;font-weight:700} .gate p{color:var(--ink3);font-size:13px;margin:0 0 18px}
  .gate input{width:100%;padding:11px 13px;border:1px solid var(--bd2);border-radius:7px;font-size:15px;margin-bottom:10px;background:var(--panel2);outline:none;transition:.12s}
  .gate input:focus{border-color:var(--pri);background:#fff;box-shadow:var(--ring)}
  .gate .err{color:var(--rose);font-size:13px;min-height:18px;font-weight:600}
  .gate .btn{width:100%;background:var(--pri);color:#fff;border:0;padding:12px}
  /* tabs */
  .tabs{display:flex;gap:6px;margin-bottom:16px;border-bottom:1px solid var(--bd);padding-bottom:0}
  .tabs button{border:1px solid transparent;background:transparent;border-radius:6px 6px 0 0;padding:9px 15px;font-size:13.5px;font-weight:600;cursor:pointer;color:var(--ink2);transition:.12s;margin-bottom:-1px;border-bottom:2px solid transparent}
  .tabs button:hover{color:var(--pri);background:var(--panel2)}
  .tabs button.on{color:var(--pri);border-bottom:2px solid var(--pri);background:transparent}
  .card{background:var(--panel);border:1px solid var(--bd);border-radius:var(--r);box-shadow:var(--sh-sm);padding:15px 17px;margin-bottom:12px}
  .qh{display:flex;gap:11px;align-items:flex-start}
  .qno{flex:none;width:28px;height:28px;border-radius:6px;background:var(--navy);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px}
  .badges{display:flex;gap:6px;flex-wrap:wrap;margin:1px 0 8px}
  .badges span{font-size:11px;font-weight:650;border-radius:20px;padding:2px 9px;color:var(--ink2);background:var(--panel3);border:1px solid var(--bd)}
  .badges .man{color:var(--amber);background:var(--amber-wash);border-color:var(--amber-bd)} .badges .auto{color:var(--emer);background:var(--emer-wash);border-color:var(--emer-bd)}
  .qtext{font-weight:700;margin-bottom:9px;font-size:14.5px;letter-spacing:-.2px}
  .kv{font-size:13px;line-height:1.8} .kv b{color:var(--ink)}
  .kv code{font-family:var(--mono);background:var(--pri-wash);border:1px solid var(--pri-bd);border-radius:5px;padding:1px 6px;color:var(--pri)}
  .ans{background:var(--emer-wash);border:1px solid var(--emer-bd);border-left:3px solid var(--emer);border-radius:7px;padding:9px 12px;margin:7px 0;font-size:13px}
  .ans b{color:var(--emer)}
  .hintlist{color:var(--amber);font-size:12.5px;margin-top:6px;background:var(--amber-wash);border:1px solid var(--amber-bd);border-radius:9px;padding:8px 11px;line-height:1.7}
  table{width:100%;border-collapse:separate;border-spacing:0;font-size:13px;background:#fff;border-radius:10px;overflow:hidden}
  th,td{border-bottom:1px solid var(--bd);padding:9px 11px;text-align:left;vertical-align:middle}
  th{background:var(--panel2);font-weight:750;color:var(--ink2)} tr:last-child td{border-bottom:0}
  tbody tr:hover td{background:var(--panel2)}
  .st-correct{color:var(--emer);font-weight:700}.st-wrong{color:var(--rose)}.st-manual{color:var(--amber)}.st-graded{color:var(--pri);font-weight:700}
  .lb{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
  .lb .chip{background:var(--panel);border:1px solid var(--bd);border-radius:20px;padding:6px 13px;font-size:13px;font-weight:600;box-shadow:var(--sh-sm)}
  .hidden{display:none} input.award{width:58px;padding:5px 8px;border:1.5px solid var(--bd2);border-radius:7px;font-family:var(--mono)}
  select{padding:6px 9px;border:1.5px solid var(--bd2);border-radius:8px;font-size:13px;background:#fff}
  .hint-note{background:var(--pri-wash);border:1px solid var(--pri-bd);color:var(--ink2);font-size:12.5px}
  .dot{width:7px;height:7px;border-radius:50%;background:var(--rose);display:inline-block;margin-left:4px;vertical-align:middle;box-shadow:0 0 0 3px rgba(225,29,72,.16)}
  .dot.hidden{display:none}
  .ictx{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--panel);border:1px solid var(--bd);border-radius:var(--r);padding:10px 14px;margin-bottom:14px;font-size:12.5px;color:var(--ink2);box-shadow:var(--sh-sm)}
  .ictx .dt{width:8px;height:8px;border-radius:50%;background:var(--teal);flex:none}
  .ictx b{color:var(--ink)} .ictx .sp{flex:1}
  .ictx code{font-family:var(--mono);background:var(--panel3);border:1px solid var(--bd2);border-radius:5px;padding:1px 7px;color:var(--pri);font-weight:650}
  .ictx .cred{display:flex;align-items:center;gap:7px;background:var(--pri-wash);border:1px solid var(--pri-bd);border-radius:20px;padding:4px 7px 4px 12px;font-weight:650;color:var(--ink2)}
  .ictx .cred .cp{border:0;background:var(--pri);color:#fff;border-radius:14px;padding:4px 11px;font-size:11px;font-weight:700;cursor:pointer}
  .ictx .cred .cp:hover{background:var(--pri-d)}
  .qna-list{display:flex;flex-direction:column;gap:10px;margin-bottom:14px}
  .qpost{border:1px solid var(--bd);border-radius:11px;padding:10px 12px;background:var(--panel2)}
  .qpost.reply{margin-left:22px;background:var(--emer-wash);border-color:var(--emer-bd)}
  .qpost .ph{display:flex;align-items:center;gap:7px;font-size:12px;font-weight:700;margin-bottom:4px}
  .qpost .ph .who{color:var(--ink)}
  .qpost .ph .rl{font-size:9.5px;font-weight:750;padding:1px 7px;border-radius:20px;background:var(--pri-wash);color:var(--pri)}
  .qpost .ph .rl.instr{background:var(--emer-wash);color:var(--emer)}
  .qpost .ph .tm{color:var(--ink3);font-weight:500;font-size:11px;margin-left:auto}
  .qpost .ph .del{color:var(--ink3);font-size:11px;cursor:pointer;font-weight:600}
  .qpost .ph .del:hover{color:var(--rose)}
  .qpost .bd{font-size:13px;color:var(--ink);line-height:1.6;white-space:pre-wrap;word-break:break-word}
  .qna-compose{display:flex;flex-direction:column;gap:8px}
  .qna-compose textarea{width:100%;padding:10px 12px;border:1.5px solid var(--bd2);border-radius:10px;font-size:13px;font-family:inherit;background:var(--panel2);outline:none;resize:vertical;min-height:60px}
  .qna-compose textarea:focus{border-color:var(--pri);background:#fff;box-shadow:var(--ring)}
  .qthread{position:relative;border:1px solid var(--bd);border-radius:11px;padding:11px 12px;margin-bottom:10px;background:var(--panel)}
  .qthread .qpost{border:0;background:transparent;padding:2px 0 6px;margin:0}
  .qthread .qpost.reply{margin-left:14px;padding-left:12px;border-left:2px solid var(--emer-bd)}
  .qstat{float:right;font-size:10.5px;font-weight:750;padding:2px 9px;border-radius:20px}
  .qstat.wait{background:var(--amber-wash);color:var(--amber);border:1px solid var(--amber-bd)}
  .qstat.done{background:var(--emer-wash);color:var(--emer);border:1px solid var(--emer-bd)}
</style>
</head>
<body>
  <div class="top"><div class="top-in">
    <div class="brand" style="cursor:pointer" title="강사 콘솔 홈" onclick="if(window.switchTab){switchTab('sol')}window.scrollTo({top:0,behavior:'smooth'})"><span class="mk">B</span>강사 콘솔 <small>· SIEM 미션</small></div>
    <div id="topr"></div>
  </div></div>

  <div id="gate" class="gate">
    <div class="gi">B</div>
    <h1>강사 인증</h1>
    <p>강사 패스코드를 입력하세요.</p>
    <input id="keyInput" type="password" placeholder="강사 패스코드">
    <div class="err" id="gateErr"></div>
    <button class="btn" id="gateBtn">입장</button>
  </div>

  <div id="app" class="wrap hidden">
    <div id="ictx" class="ictx"></div>
    <div class="tabs">
      <button id="tabSol" class="on">문제 풀이 해설</button>
      <button id="tabSub">제출 현황 · 채점</button>
      <button id="tabUnl">사용자 · 해금</button>
      <button id="tabQna">문의 게시판 <span id="qnaDot" class="dot hidden"></span></button>
      <button id="tabSys">시스템 정보</button>
    </div>
    <div id="solView"></div>
    <div id="subView" class="hidden"></div>
    <div id="unlockView" class="hidden"></div>
    <div id="qnaView" class="hidden"></div>
    <div id="sysView" class="hidden"></div>
  </div>

<script>
const $=s=>document.querySelector(s);
let KEY="", SOL=null;
async function jget(u){const r=await fetch(u);return {ok:r.ok,d:await r.json()};}
async function jpost(u,b){const r=await fetch(u,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)});return {ok:r.ok,d:await r.json()};}
function esc(s){return (s||'').toString().replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}

$('#gateBtn').onclick=enter;
$('#keyInput').addEventListener('keydown',e=>{if(e.key==='Enter')enter();});
async function showApp(){
  $('#gate').classList.add('hidden'); $('#app').classList.remove('hidden');
  $('#topr').innerHTML='<button class="btn pri sm" onclick="location.href=\'/\'">미션 포털</button> '+
    '<button class="btn ghost sm" onclick="window.open(\'http://\'+location.hostname+\':8080/\',\'_blank\')">데모 웹</button> '+
    '<button class="btn ghost sm" onclick="window.open(\'https://\'+location.hostname,\'_blank\')">Wazuh 대시보드</button> '+
    '<button class="btn ghost sm" onclick="window.open(\'/guide\',\'_blank\')">교안</button> '+
    '<button class="btn ghost sm" id="outBtn">로그아웃</button>';
  const o=document.getElementById('outBtn'); if(o) o.onclick=async()=>{await fetch('/api/logout',{method:'POST'});location.href='/';};
  try{
    const c=await (await fetch('/api/config')).json();
    const wu=c.wazuh_user||'admin', wpw=c.wazuh_pass||'', dt=c.dataset_time||'';
    const cred=wpw?`<span class="cred">Wazuh 로그인 · <b>${esc(wu)}</b> / <code>${esc(wpw)}</code> <button class="cp" onclick="cpBtn(this,'${esc(wpw)}')">복사</button></span>`:'';
    $('#ictx').innerHTML=`<span class="dt"></span><span>이 로그셋 기준 시각 <b>${esc(dt)}</b> · 이벤트는 <b>이전 24시간</b> 내 분포 (Discover가 비면 <b>Last 1 year</b>로)</span><span class="sp"></span>${cred}`;
  }catch(e){}
  renderSolutions();
}
async function enter(){
  KEY=$('#keyInput').value.trim(); if(!KEY)return;
  const {ok,d}=await jget('/api/instructor/solutions?key='+encodeURIComponent(KEY));
  if(!ok){$('#gateErr').textContent='패스코드가 올바르지 않습니다';return;}
  SOL=d; showApp();
}
async function boot(){   // session-based auth (portal login as admin/p@ssw0rd)
  const {ok,d}=await jget('/api/instructor/solutions');
  if(ok){ SOL=d; KEY=''; showApp(); }
}
boot();
let curTab='sol';
['Sol','Sub','Unl','Qna','Sys'].forEach(x=>$('#tab'+x).onclick=()=>switchTab(x.toLowerCase()));
function switchTab(t){
  curTab=t;
  const tm={sol:'#tabSol',sub:'#tabSub',unl:'#tabUnl',qna:'#tabQna',sys:'#tabSys'};
  const vm={sol:'#solView',sub:'#subView',unl:'#unlockView',qna:'#qnaView',sys:'#sysView'};
  Object.entries(tm).forEach(([k,s])=>$(s).classList.toggle('on',k===t));
  Object.entries(vm).forEach(([k,s])=>$(s).classList.toggle('hidden',k!==t));
  if(t==='sub')renderSubs(); if(t==='unl')renderUnlock(); if(t==='qna')renderQna(); if(t==='sys')renderSys();
}
/* clipboard that also works over plain HTTP */
function copyText(t){ if(navigator.clipboard&&window.isSecureContext){return navigator.clipboard.writeText(t).catch(()=>fbCopy(t));} return fbCopy(t); }
function fbCopy(t){const a=document.createElement('textarea');a.value=t;a.setAttribute('readonly','');a.style.position='fixed';a.style.top='-1000px';document.body.appendChild(a);a.focus();a.select();let ok=false;try{ok=document.execCommand('copy');}catch(e){}document.body.removeChild(a);return Promise.resolve(ok);}
window.cpBtn=async(b,t)=>{await copyText(t);const o=b.textContent;b.textContent='복사됨 ';setTimeout(()=>b.textContent=o,1200);};

/* near-real-time: refresh the active tab automatically (skip while editing an input) */
setInterval(async()=>{
  if(document.hidden||$('#app').classList.contains('hidden'))return;
  const ae=document.activeElement, editing=ae&&['INPUT','TEXTAREA','SELECT'].includes(ae.tagName);
  try{const {d}=await jget('/api/qna?key='+encodeURIComponent(KEY));
    if(d&&d.posts){const open=d.posts.filter(p=>!p.parent).some(p=>!d.posts.some(r=>r.parent===p.id));
      $('#qnaDot').classList.toggle('hidden',!open);}}catch(e){}
  if(editing)return;
  if(curTab==='sub')renderSubs(); else if(curTab==='unl')renderUnlock(); else if(curTab==='qna')renderQna();
},7000);
function renderSolutions(){
  const sc=SOL.scoring;
  let head=`<div class="card hint-note"><b>배점 규칙</b> · 기본점 난이도별(하10·중15·상20) · 오답 −${sc.wrong}점/회 · 힌트 누적 −1·−2·−3점(최대 ${sc.max_hints}개) · 필수 ${SOL.max_required}점 + 보너스 ${SOL.max_bonus}점</div>`;
  const cards=SOL.questions.map(q=>{
    const man=q.grade.mode==='manual';
    const hints=(q.hints||[]).map((h,i)=>`${i+1}) ${esc(h)}`).join('<br>');
    const gr=man?'수동채점':(q.grade.mode+' · 정답토큰: '+(q.grade.accept||[]).join(', ')+(q.grade.n?` (${q.grade.n}개↑)`:''));
    return `<div class="card" id="solq_${q.qno}"><div class="qh"><div class="qno">${q.qno}</div><div style="flex:1;min-width:0">
      <div class="badges"><span>${q.section}</span><span>${esc(q.type)}</span><span>난이도 ${q.diff}</span><span>${q.score}점</span><span class="${man?'man':'auto'}">${man?'수동채점':'자동채점'}</span></div>
      <div class="qtext">${esc(q.question)}</div>
      <div class="ans"><b>정답</b> · ${esc(q.answer)}</div>
      <div class="kv"><b>근거</b> ${esc(q.explain.evidence)}<br><b>조회</b> <code>${esc(q.explain.wazuh)}</code><br><b>채점</b> ${esc(gr)}</div>
      <div class="hintlist"><b>힌트</b><br>${hints}</div>
    </div></div></div>`;
  }).join('');
  $('#solView').innerHTML=head+cards;
}
async function renderSubs(){
  const {ok,d}=await jget('/api/instructor/submissions?key='+encodeURIComponent(KEY));
  if(!ok){$('#subView').innerHTML='<div class="card">권한 오류</div>';return;}
  const lb=await jget('/api/leaderboard?key='+encodeURIComponent(KEY));
  const chips=((lb.d&&lb.d.board)||[]).map((r,i)=>`<span class="chip">${i+1}. <b>${esc(r.team)}</b> · ${r.score}점 · ${r.solved}</span>`).join('')||'<span class="chip">아직 제출 없음</span>';
  const rows=d.subs.map(s=>{
    const stc={correct:'st-correct',wrong:'st-wrong',manual:'st-manual',graded:'st-graded'}[s.status]||'';
    const act=s.manual&&s.status!=='graded'?`<input class="award" id="aw_${esc(s.team)}_${s.qno}" type="number" min="0" max="${s.max}" value="${s.max}"> <button class="btn sm" onclick="award('${esc(s.team)}',${s.qno})">채점</button>`:'';
    return `<tr><td><b>${esc(s.team)}</b></td><td>${s.qno}</td><td class="${stc}">${s.status}</td><td>${s.score}/${s.max}</td><td>힌트${s.hints_used}·오답${s.wrong_count}</td><td style="max-width:260px">${esc(s.answer)}</td><td>${act}</td></tr>`;
  }).join('');
  $('#subView').innerHTML=cohortSummary(d.subs,(lb.d&&lb.d.board)||[])+
    `<div class="lb">${chips}</div><div class="card" style="padding:0;overflow-x:auto"><table>
    <tr><th>학생</th><th>문항</th><th>상태</th><th>점수</th><th>기록</th><th>답안</th><th>수동채점</th></tr>
    ${rows||'<tr><td colspan=7 style="text-align:center;color:#94a3b8;padding:20px">제출 없음</td></tr>'}</table></div>
    <div style="margin-top:10px"><button class="btn sm" onclick="renderSubs()">새로고침</button></div>`;
}
/* 코호트 현황 요약 — 기존 제출 데이터로 클라이언트에서 집계(백엔드 무변경) */
function cohortSummary(subs, board){
  const teams=[...new Set(subs.map(s=>s.team))];
  const solved=s=> s.status==='correct' || (s.status==='graded' && (+s.score)>0);
  const pending=subs.filter(s=>s.manual && s.status==='manual').length;
  const scores=board.map(r=>+r.score);
  const avg=scores.length?Math.round(scores.reduce((a,b)=>a+b,0)/scores.length):0;
  const max=scores.length?Math.max(...scores):0;
  const totalStudents=(SOL&&SOL.questions)?undefined:undefined;
  // 문항별 정답률
  const perQ={};
  subs.forEach(s=>{const q=perQ[s.qno]||(perQ[s.qno]={att:0,ok:0});q.att++;if(solved(s))q.ok++;});
  const qtitle=n=>{const q=(SOL.questions||[]).find(x=>x.qno===n);return q?q.question:('Q'+n);};
  const missed=Object.entries(perQ).map(([qno,v])=>({qno:+qno,att:v.att,ok:v.ok,rate:v.att?v.ok/v.att:0}))
     .filter(x=>x.att>0).sort((a,b)=>a.rate-b.rate || b.att-a.att).slice(0,6);
  const stat=(label,val,sub)=>`<div style="flex:1;min-width:96px"><div style="font-size:22px;font-weight:800;color:var(--ink);letter-spacing:-.5px">${val}</div><div style="font-size:11.5px;color:var(--ink3);font-weight:600">${label}${sub?` <span style="color:var(--ink3)">${sub}</span>`:''}</div></div>`;
  const bar=x=>{const pct=Math.round(x.rate*100);const col=pct<40?'var(--rose)':pct<70?'var(--amber)':'var(--emer)';
    return `<div onclick="gotoSolution(${x.qno})" title="클릭하면 해당 문항 해설로 이동" style="display:flex;align-items:center;gap:9px;padding:5px 4px;border-bottom:1px dashed var(--bd);cursor:pointer;border-radius:6px" onmouseover="this.style.background='var(--panel2)'" onmouseout="this.style.background=''">
      <span class="qno" style="width:24px;height:24px;font-size:12px">${x.qno}</span>
      <span style="flex:1;min-width:0;font-size:12.5px;color:var(--ink2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(qtitle(x.qno))}</span>
      <span style="width:120px;height:8px;background:var(--panel3);border-radius:6px;overflow:hidden;flex:none"><span style="display:block;height:100%;width:${pct}%;background:${col}"></span></span>
      <span style="width:74px;text-align:right;font-size:11.5px;color:var(--ink3);flex:none">정답 ${x.ok}/${x.att} (${pct}%)</span></div>`;};
  if(!subs.length) return `<div class="card hint-note">아직 제출이 없습니다. 학생들이 답안을 제출하면 이곳에 참여율·평균·문항별 정답률이 집계됩니다.</div>`;
  return `<div class="card">
    <div style="display:flex;align-items:center;gap:10px"><div class="qtext" style="flex:1">현황 요약</div>
      <button class="btn sm" onclick="exportCSV()">성적 CSV 내보내기</button></div>
    <div style="display:flex;gap:14px;flex-wrap:wrap;margin:8px 0 6px">
      ${stat('참여 학생',teams.length+'명')}
      ${stat('평균 점수',avg+'점')}
      ${stat('최고 점수',max+'점')}
      ${stat('총 제출',subs.length+'건')}
      ${stat('채점 대기',pending+'건','(서술형)')}
    </div>
    <div style="font-size:12.5px;font-weight:750;color:var(--ink2);margin:10px 0 2px">가장 많이 틀린 문항 <span style="color:var(--ink3);font-weight:500">— 강의 때 짚어주기 좋은 순서</span></div>
    ${missed.map(bar).join('')||'<div style="font-size:12.5px;color:var(--ink3);padding:6px 0">집계할 데이터가 아직 적습니다.</div>'}
  </div>`;
}
window.gotoSolution=(qno)=>{
  switchTab('sol');
  setTimeout(()=>{const el=document.getElementById('solq_'+qno);
    if(el){el.scrollIntoView({behavior:'smooth',block:'start'});
      el.style.transition='box-shadow .3s'; el.style.boxShadow='0 0 0 3px var(--pri-wash)';
      setTimeout(()=>el.style.boxShadow='',1500);}},130);
};
window.exportCSV=async()=>{
  const {ok,d}=await jget('/api/instructor/submissions?key='+encodeURIComponent(KEY));
  if(!ok){alert('권한 오류');return;}
  if(!d.subs.length){alert('내보낼 제출 데이터가 없습니다.');return;}
  const head=['team','qno','status','score','max','hints_used','wrong_count','answer'];
  const rows=[head];
  d.subs.forEach(s=>rows.push([s.team,s.qno,s.status,s.score,s.max,s.hints_used,s.wrong_count,(s.answer||'').replace(/\r?\n/g,' ')]));
  const csv=rows.map(r=>r.map(c=>{const v=(c==null?'':String(c));return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v;}).join(',')).join('\r\n');
  const blob=new Blob(['﻿'+csv],{type:'text/csv;charset=utf-8'});
  const url=URL.createObjectURL(blob), a=document.createElement('a');
  a.href=url; a.download='siem-lab-grades.csv'; document.body.appendChild(a); a.click();
  setTimeout(()=>{document.body.removeChild(a); URL.revokeObjectURL(url);},500);
};
window.award=async(team,qno)=>{const v=+document.getElementById(`aw_${team}_${qno}`).value;await jpost('/api/instructor/grade',{key:KEY,team,qno,award:v});renderSubs();};
async function renderUnlock(){
  const {ok,d}=await jget('/api/instructor/users?key='+encodeURIComponent(KEY));
  if(!ok){$('#unlockView').innerHTML='<div class="card">권한 오류</div>';return;}
  const ns=d.num_stages;
  const opts=(sel)=>{let o=`<option value="0"${sel===0?' selected':''}>자동</option>`;for(let s=1;s<=ns;s++)o+=`<option value="${s}"${sel===s?' selected':''}>${s}단계까지</option>`;return o;};
  const head=`<div class="card hint-note"><b>단계별 해금</b> · 각 단계 60% 완료 시 다음 단계 자동 해금. 강사가 사용자별로 강제 해금(오버라이드) 가능.<br>
    <span style="color:var(--ink3);font-size:12px">${d.stage_names.map((n,i)=>`${n}(${d.stage_totals[i]}문항)`).join(' · ')}</span></div>`;
  const rows=d.users.map(u=>`<tr><td><b>${esc(u.team)}</b></td><td>현재 <b style="color:var(--pri)">${u.unlocked}단계</b></td>
    <td>${u.stage_done.map((c,i)=>`${i+1}:${c}/${d.stage_totals[i]}`).join(' · ')}</td><td>${u.score}점</td>
    <td><select id="ov_${esc(u.team)}">${opts(u.override)}</select> <button class="btn sm" onclick="setUnlock('${esc(u.team)}')">적용</button></td>
    <td><button class="btn sm" style="color:var(--rose)" onclick="resetUser('${esc(u.team)}')">초기화</button></td></tr>`).join('');
  $('#unlockView').innerHTML=head+`<div class="card" style="padding:0;overflow-x:auto"><table>
    <tr><th>학생</th><th>해금 상태</th><th>단계별 완료</th><th>점수</th><th>강제 해금(오버라이드)</th><th>진행 초기화</th></tr>${rows}</table></div>
    <div style="margin-top:10px;display:flex;gap:8px;align-items:center">
      <button class="btn sm" onclick="renderUnlock()">새로고침</button>
      <span style="flex:1"></span>
      <button class="btn sm" style="color:var(--rose);border-color:var(--amber-bd)" onclick="resetAll()">전체 초기화(재사용 시)</button></div>`;
}
window.resetUser=async(team)=>{ if(!confirm(team+' 학생의 제출·점수·힌트·해금을 모두 초기화할까요? (되돌릴 수 없습니다)'))return;
  await jpost('/api/instructor/reset',{key:KEY,team}); renderUnlock(); };
window.resetAll=async()=>{ if(!confirm('모든 학생의 진행 상황을 초기화합니다. 다음 기수/재실습을 위해서만 사용하세요. 계속할까요?'))return;
  if(!confirm('정말 전체 초기화할까요? 모든 제출·점수가 삭제됩니다.'))return;
  const {d}=await jpost('/api/instructor/reset',{key:KEY,team:'*'}); alert('초기화 완료'+(d&&d.cleared!=null?` (${d.cleared}명)`:'')); renderUnlock(); };
window.setUnlock=async(team)=>{const v=+document.getElementById('ov_'+team).value;await jpost('/api/instructor/unlock',{key:KEY,team,stage:v});renderUnlock();};

/* ---- 문의 게시판 (강사: 답변/공지/삭제) ---- */
let iReplyTo=0;
function fmtT(t){const x=new Date(t*1000);const p=n=>('0'+n).slice(-2);return p(x.getMonth()+1)+'/'+p(x.getDate())+' '+p(x.getHours())+':'+p(x.getMinutes());}
async function renderQna(){
  const {d}=await jget('/api/qna?key='+encodeURIComponent(KEY));
  const posts=(d&&d.posts)||[], tops=posts.filter(p=>!p.parent), reps=posts.filter(p=>p.parent);
  const one=(p,isr)=>`<div class="qpost ${isr?'reply':''}"><div class="ph">
      <span class="who">${esc(p.author)}</span><span class="rl ${p.role==='instructor'?'instr':''}">${p.role==='instructor'?'강사':'학생'}</span>
      ${p.qno?`<span class="rl">Q${p.qno}</span>`:''}<span class="tm">${fmtT(p.ts)}</span>
      <span class="del" onclick="qnaDel(${p.id})">삭제</span></div>
      <div class="bd">${esc(p.body)}</div>
      ${!isr?`<button class="btn sm" style="margin-top:7px" onclick="iReply(${p.id})">답변 달기</button>`:''}</div>`;
  const isAns=p=>reps.some(r=>r.parent===p.id&&r.role==='instructor');
  tops.sort((a,b)=>(isAns(a)-isAns(b))||(b.id-a.id));   // 미답변 먼저
  const body=tops.length
    ? tops.map(p=>{
        const rs=reps.filter(r=>r.parent===p.id);
        const st=isAns(p)?'<span class="qstat done">답변완료</span>':'<span class="qstat wait">답변대기</span>';
        return `<div class="qthread">${st}${one(p,false)}${rs.map(r=>one(r,true)).join('')}</div>`;
      }).join('')
    : '<p style="color:var(--ink3);font-size:13px;padding:12px">아직 등록된 문의가 없습니다.</p>';
  $('#qnaView').innerHTML=`<div class="card"><div class="qna-list">${body}</div>
    <div class="qna-compose"><textarea id="iQnaText" placeholder="답변 또는 전체 공지를 작성하세요."></textarea>
      <div style="display:flex;gap:8px;align-items:center">
        <button class="btn pri sm" onclick="iSend()">등록</button>
        <button class="btn sm" onclick="iClearReply()">답변대상 해제</button>
        <span id="iReplyLbl" style="font-size:12px;color:var(--pri);font-weight:700"></span></div></div></div>`;
  if(iReplyTo){const l=$('#iReplyLbl'); if(l) l.textContent='↳ Q#'+iReplyTo+' 에 답변';}
}
window.iReply=(id)=>{iReplyTo=id;const t=$('#iQnaText');if(t)t.focus();const l=$('#iReplyLbl');if(l)l.textContent='↳ Q#'+id+' 에 답변';};
window.iClearReply=()=>{iReplyTo=0;const l=$('#iReplyLbl');if(l)l.textContent='';};
window.iSend=async()=>{const t=$('#iQnaText');const v=(t.value||'').trim();if(!v)return;await jpost('/api/qna',{key:KEY,body:v,parent:iReplyTo});t.value='';iReplyTo=0;renderQna();};
window.qnaDel=async(id)=>{if(!confirm('이 글을 삭제할까요?'))return;await jpost('/api/qna/delete',{key:KEY,id});renderQna();};

/* ---- 시스템 정보 (자격증명 · 학생 계정) ---- */
async function renderSys(){
  let c={}; try{c=await(await fetch('/api/config')).json();}catch(e){}
  const host=location.hostname, n=c.user_count||20;
  const box=(title,url,user,pw)=>`<div class="card"><div class="qtext">${title}</div><div class="kv">
    <b>주소</b> <code>${esc(url)}</code> <button class="btn sm" onclick="cpBtn(this,'${esc(url)}')">복사</button><br>
    <b>아이디</b> <code>${esc(user)}</code>${pw?` &nbsp;&nbsp;<b>비밀번호</b> <code>${esc(pw)}</code> <button class="btn sm" onclick="cpBtn(this,'${esc(pw)}')">복사</button>`:''}</div></div>`;
  const accts=Array.from({length:n},(_,i)=>'user_'+(i+1));
  $('#sysView').innerHTML=`
    <div class="card" style="border-top:3px solid var(--pri)">
      <div class="qtext">데이터셋 재생성</div>
      <div class="kv" style="color:var(--ink2)">로그와 정답키를 <b>현재 시각 기준</b>으로 클린 재적재합니다. 실습 로그를 새로 찍고 싶을 때(예: 강의 당일) 사용하세요.
        <ul style="margin:7px 0 4px;padding-left:18px;color:var(--ink2);font-size:13px">
          <li>약 3~4분 소요 · 진행 중 포털이 잠깐 재시작될 수 있습니다</li>
          <li>학생 진행(제출·점수·문의)은 <b>그대로 보존</b>됩니다</li>
          <li>새 기수/재실습이면 먼저 <b>[사용자·해금 → 전체 초기화]</b>를 권장</li>
        </ul></div>
      <div id="rebBox" style="margin:10px 0"></div>
      <button class="btn pri sm" id="rebBtn" onclick="rebuildStart()">데이터셋 재생성</button>
      <button class="btn sm" onclick="rebuildStatus()">상태 새로고침</button>
    </div>
    <div class="card hint-note">실습 운영에 필요한 접속 정보입니다. 학생 안내와 본인 로그인에 사용하세요. (복사 버튼은 HTTP에서도 동작)</div>
    ${box('Wazuh 대시보드', 'https://'+host+'/', c.wazuh_user||'admin', c.wazuh_pass||'(설치 로그의 Password 참조)')}
    ${box('‍강사 로그인 (포털)', 'http://'+host+':8081/', 'admin', 'p@ssw0rd')}
    <div class="card"><div class="qtext">학생 포털 계정 · 총 ${n}개 (비밀번호 = 아이디)</div>
      <div class="kv"><b>주소</b> <code>http://${esc(host)}:8081/</code> <button class="btn sm" onclick="cpBtn(this,'http://${esc(host)}:8081/')">복사</button></div>
      <div style="display:flex;flex-wrap:wrap;gap:6px;margin-top:11px">${accts.map(a=>`<button class="btn sm ghost" onclick="cpBtn(this,'${a}')" title="아이디 복사(비번 동일)">${a}</button>`).join('')}</div>
      <div style="font-size:12px;color:var(--ink3);margin-top:9px">계정 버튼을 누르면 아이디가 복사됩니다. 비밀번호는 아이디와 동일합니다 (예: user_1 / user_1).</div></div>
    <div class="card"><div class="qtext">페이지 링크</div><div class="kv">
      학생 포털 <code>http://${esc(host)}:8081/</code><br>교안 <code>http://${esc(host)}:8081/guide</code><br>
      Wazuh 대시보드 <code>https://${esc(host)}/</code><br>라이브 데모 <code>http://${esc(host)}:8080/</code></div></div>`;
  rebuildStatus();
}

/* ---- 데이터셋 재생성 (로그+정답키를 현재 시각 기준으로 클린 재적재) ---- */
let rebPoll=null;
async function rebuildStatus(){
  try{const {d}=await jget('/api/instructor/rebuild/status?key='+encodeURIComponent(KEY));
    const box=$('#rebBox'); if(!box)return d;
    if(d.running){
      box.className='card hint-note';
      box.innerHTML=`<b>재생성 진행 중…</b> 약 3~4분 소요됩니다. 완료되면 포털이 잠깐 재시작될 수 있어요.<br><span style="font-size:12px;color:var(--ink3)">단계: ${esc(d.phase||'준비 중')}</span>`;
    }else if(d.last_result){
      const okr=d.last_result==='done';
      box.className='card '+(okr?'':'hint-note');
      box.innerHTML=`<b style="color:${okr?'var(--emer)':'var(--rose)'}">${okr?'재생성 완료':'재생성 실패'}</b> · 마지막 실행 ${esc(d.finished_at||'')}<br><span style="font-size:12px;color:var(--ink3)">${esc(d.tail||'')}</span>`;
    }
    return d;
  }catch(e){return null;}
}
window.rebuildStart=async()=>{
  if(!confirm('로그와 정답키를 현재 시각 기준으로 새로 생성합니다.\n\n· 약 3~4분 소요 (진행 중 포털이 잠깐 재시작될 수 있음)\n· 학생 진행(제출·점수)은 그대로 보존됩니다\n· 새 기수라면 먼저 [사용자·해금 → 전체 초기화]를 권장\n\n계속할까요?'))return;
  const {ok,d}=await jpost('/api/instructor/rebuild',{key:KEY});
  if(!ok){alert('시작 실패: '+((d&&d.error)||'권한 오류'));return;}
  if(d && d.already) alert('이미 재생성이 진행 중입니다.');
  const b=$('#rebBtn'); if(b){b.disabled=true;b.textContent='진행 중…';}
  if(rebPoll)clearInterval(rebPoll);
  rebPoll=setInterval(async()=>{ const s=await rebuildStatus();
    if(s&&!s.running){clearInterval(rebPoll);rebPoll=null;const bb=$('#rebBtn');if(bb){bb.disabled=false;bb.textContent='데이터셋 재생성';}}
  },5000);
  rebuildStatus();
};
</script>
</body>
